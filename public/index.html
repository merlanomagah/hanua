<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Bookcase: the menu. Each book is one area of life. -->
    <aside class="shelf" aria-label="Your books">
      <div class="case">
        <div class="case-head">
          <span class="wordmark">Hanua</span>
          <span class="case-sub">LIBRARY</span>
        </div>
        <nav class="books" id="books"></nav>
        <div class="case-fill"></div>
        <div class="case-foot" aria-hidden="true">
          <div class="case-foot-row">
            <img src="assets/shelf/bookend.png" alt="" class="bookend">
            <span class="tagline">Plan with purpose.<br>Live with others in mind.</span>
          </div>
          <img src="assets/shelf/plank.png" alt="" class="plank">
        </div>
      </div>
    </aside>

    <main class="room">
      <!-- The wall: your overview -->
      <section class="wall" aria-label="Overview">
        <div class="window-light" aria-hidden="true"></div>
        <div class="wall-dim" aria-hidden="true"></div>

        <div class="wall-in">
          <div class="status" id="status"></div>

          <div class="wall-row">
            <div class="wall-left">
              <div class="greet-shelf">
                <div class="greet-row">
                  <button class="lamp" id="lamp" type="button">
                    <span class="lamp-glow" aria-hidden="true"></span>
                    <img src="assets/obj/lamp-off.png" alt="Lamp" class="lamp-img">
                    <img src="assets/obj/lamp-on.png" alt="" class="lamp-img lamp-lit">
                  </button>
                  <div class="greet-text">
                    <span class="eyebrow" id="today-label"></span>
                    <h1 id="greet">Good morning.</h1>
                  </div>
                  <div class="clock" role="img" aria-label="Clock" id="clock">
                    <img src="assets/obj/clock.png" alt="">
                    <span class="hand hour" id="hand-h"></span>
                    <span class="hand minute" id="hand-m"></span>
                    <span class="hand second" id="hand-s"></span>
                    <span class="hand-cap"></span>
                  </div>
                </div>
                <div class="float-shelf" aria-hidden="true">
                  <img src="assets/shelf/bookend.png" alt="" class="bracket left">
                  <img src="assets/shelf/bookend.png" alt="" class="bracket right">
                  <img src="assets/shelf/plank.png" alt="" class="plank">
                </div>
              </div>

              <div class="ask-wrap">
                <form class="ask" id="ask-form">
                  <span class="ask-label">CLAUDE</span>
                  <span class="divider" aria-hidden="true"></span>
                  <input id="ask-input" type="text" autocomplete="off" aria-label="Ask Claude" placeholder="Ask about anything on your wall…">
                  <button type="submit">ASK</button>
                </form>
                <div class="answer" id="ask-answer" hidden></div>
              </div>

              <div class="monitor-wrap">
                <div class="monitor" id="monitor">
                  <button class="glass" id="money-screen" type="button" aria-label="Open the Money book">
                    <span class="screen" id="screen"></span>
                  </button>
                  <div class="chin">
                    <span class="brand">HANUA</span>
                    <span class="led" aria-hidden="true"></span>
                    <button class="power" id="screen-power" type="button" aria-pressed="true" title="Turn the screen off">
                      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="wall-right">
              <figure class="calendar">
                <svg class="hanger" width="120" height="40" viewBox="0 0 120 40" aria-hidden="true">
                  <line x1="60" y1="4" x2="14" y2="38" stroke="#7A6B55" stroke-width="1"/>
                  <line x1="60" y1="4" x2="106" y2="38" stroke="#7A6B55" stroke-width="1"/>
                  <circle cx="60" cy="4" r="3.5" fill="#42382C"/>
                </svg>
                <div class="cal-card">
                  <div class="binding" aria-hidden="true"><i></i><i></i></div>
                  <div class="cal-body" id="calendar"></div>
                </div>
              </figure>

              <div class="deco-shelf" aria-hidden="true">
                <div class="deco-row">
                  <img src="assets/obj/books.png" alt="" class="deco-books">
                  <img src="assets/obj/plant.png" alt="" class="deco-plant">
                </div>
                <div class="float-shelf">
                  <img src="assets/shelf/bookend.png" alt="" class="bracket left">
                  <img src="assets/shelf/bookend.png" alt="" class="bracket right">
                  <img src="assets/shelf/plank.png" alt="" class="plank">
                </div>
              </div>
            </div>
          </div>

          <div class="wall-row notes-row">
            <div class="wall-left">
              <div class="notes" id="notes" aria-label="Pinned notes"></div>
            </div>
            <div class="wall-right"></div>
          </div>

          <div class="to-desk">
            <button type="button" id="to-desk"><span>TO THE DESK</span><span class="arrow">↓</span></button>
          </div>
        </div>
      </section>

      <!-- Looking down at the desk: today -->
      <div class="desk-edge" id="desk-edge" aria-hidden="true"></div>
      <section class="desk" aria-label="Today">
        <article class="notepad" id="todo"></article>
        <article class="agenda" id="agenda"></article>
        <article class="receipt" id="week"></article>

        <div class="scatter" aria-hidden="true">
          <img src="assets/obj/sticky-pad.png" alt="" class="sticky-pad">
          <img src="assets/obj/pencil.png" alt="" class="pencil">
          <img src="assets/obj/clips.png" alt="" class="clips">
        </div>
        <img src="assets/obj/cup.png" alt="" class="cup" aria-hidden="true">
      </section>

      <form class="feed" id="feed-form">
        <span class="feed-label">FEED</span>
        <span class="divider" aria-hidden="true"></span>
        <input id="feed-input" type="text" autocomplete="off" aria-label="Feed" placeholder="“Paid $64 for groceries” · “Dentist next Tuesday” · “Learned: …”">
        <button type="submit">ADD</button>
      </form>
    </main>
  </div>

  <!-- An open book -->
  <div class="reader" id="reader" hidden>
    <div class="open-book" id="open-book" role="dialog" aria-modal="true" aria-labelledby="book-title">
      <button class="reader-close" id="reader-close" type="button" aria-label="Put the book back">×</button>
      <div class="page left" id="page-left"></div>
      <div class="page right" id="page-right"></div>
    </div>
  </div>

  <dialog id="draft-dialog">
    <form method="dialog" id="draft-form">
      <h3>Add to <span id="draft-area"></span>?</h3>
      <p class="draft-note" id="draft-note"></p>
      <div id="draft-fields"></div>
      <div class="dialog-actions">
        <button value="cancel" type="submit" class="ghost">Cancel</button>
        <button value="save" type="submit">Save to Notion</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
