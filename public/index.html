<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Bookcase: the menu. Each book is one area of life. -->
    <aside class="shelf" aria-label="Your books">
      <div class="case">
        <div class="case-crown" aria-hidden="true">
          <span class="wordmark">Hanua</span>
          <svg class="pot-plant" viewBox="0 0 90 80" aria-hidden="true"></svg>
        </div>
        <nav class="books" id="books"></nav>
        <div class="case-foot" aria-hidden="true"></div>
      </div>
    </aside>

    <main class="room">
      <!-- The wall: your overview -->
      <section class="wall" aria-label="Overview">
        <svg class="hanging left" viewBox="0 0 140 300" aria-hidden="true"></svg>
        <svg class="hanging right" viewBox="0 0 140 300" aria-hidden="true"></svg>

        <header class="greeting">
          <div>
            <p class="eyebrow" id="today-label"></p>
            <h1 id="greet">Good morning.</h1>
          </div>
          <div class="status" id="status"></div>
        </header>

        <form class="ask" id="ask-form">
          <input id="ask-input" type="text" autocomplete="off" placeholder="Ask Claude about anything on your wall…">
          <button type="submit">Ask</button>
        </form>
        <div class="answer" id="ask-answer" hidden></div>

        <div class="wall-grid">
          <button class="screen" id="money-screen" type="button" aria-label="Open the Money book"></button>
          <figure class="calendar" id="calendar"></figure>
          <div class="notes" id="notes" aria-label="Sticky notes"></div>
        </div>
      </section>

      <!-- Looking down at the table: today -->
      <div class="table-edge" aria-hidden="true"></div>
      <section class="table" aria-label="Today">
        <div class="table-grid">
          <article class="notepad" id="todo"></article>
          <article class="agenda" id="agenda"></article>
          <article class="receipt" id="week"></article>
        </div>
        <svg class="mug" viewBox="0 0 120 120" aria-hidden="true">
          <ellipse cx="60" cy="64" rx="44" ry="44" fill="rgb(0 0 0 / 0.18)"/>
          <circle cx="58" cy="58" r="42" fill="#efe9df"/>
          <circle cx="58" cy="58" r="33" fill="#6b4a32"/>
          <circle cx="50" cy="50" r="9" fill="#8a6446" opacity="0.6"/>
          <path d="M98 50 q20 8 0 20" fill="none" stroke="#efe9df" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <svg class="pen" viewBox="0 0 200 20" aria-hidden="true">
          <rect x="4" y="6" width="170" height="9" rx="4" fill="#24364f"/>
          <path d="M174 6 L196 10.5 L174 15 Z" fill="#c9b07a"/>
          <rect x="20" y="4" width="40" height="3" rx="1.5" fill="#c9b07a"/>
        </svg>
      </section>

      <form class="feed" id="feed-form">
        <span class="feed-label">Feed</span>
        <input id="feed-input" type="text" autocomplete="off" placeholder="“Paid $64 for groceries” · “Dentist next Tuesday” · “Learned: …”">
        <button type="submit">Add</button>
      </form>
    </main>
  </div>

  <!-- An open book -->
  <div class="reader" id="reader" hidden>
    <div class="open-book" id="open-book" role="dialog" aria-modal="true" aria-labelledby="book-title">
      <button class="reader-close" id="reader-close" type="button" aria-label="Put the book back">×</button>
      <div class="page left" id="page-left"></div>
      <div class="page right" id="page-right"></div>
    </div>
  </div>

  <dialog id="draft-dialog">
    <form method="dialog" id="draft-form">
      <h3>Add to <span id="draft-area"></span>?</h3>
      <p class="draft-note" id="draft-note"></p>
      <div id="draft-fields"></div>
      <div class="dialog-actions">
        <button value="cancel" type="submit" class="ghost">Cancel</button>
        <button value="save" type="submit">Save to Notion</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
